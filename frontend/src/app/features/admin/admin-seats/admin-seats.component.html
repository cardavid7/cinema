<div class="min-h-screen bg-slate-100 px-4 py-8">
  <div class="mx-auto max-w-4xl">
    <a routerLink="/admin" class="mb-4 inline-block text-sm font-medium text-indigo-600 hover:underline">← Panel</a>
    <h1 class="mb-6 text-2xl font-semibold text-slate-800">Asientos</h1>

    @if (errorMessage()) {
      <p class="mb-4 text-red-600">{{ errorMessage() }}</p>
    }

    @if (loading()) {
      <p class="text-slate-600">Cargando...</p>
    } @else {
      <div class="mb-4">
        <label class="mb-1 block text-sm font-medium text-slate-700">Sala</label>
        <select
          class="w-full max-w-xs rounded border border-slate-300 px-3 py-2"
          [value]="selectedRoomId()"
          (change)="selectRoom(+$any($event.target).value)"
        >
          @for (room of rooms(); track room.id) {
            <option [value]="room.id">{{ room.name }}</option>
          }
        </select>
      </div>

      <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
        <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-3 rounded-lg bg-white p-5 shadow">
          <h2 class="font-semibold text-slate-800">{{ editingId() ? 'Editar asiento' : 'Nuevo asiento' }}</h2>

          <div>
            <label class="mb-1 block text-sm font-medium text-slate-700">Número de asiento</label>
            <input formControlName="seat_number" placeholder="A1" class="w-full rounded border border-slate-300 px-3 py-2" />
          </div>

          <label class="flex items-center gap-2 text-sm text-slate-700">
            <input type="checkbox" formControlName="is_vip" />
            VIP
          </label>

          <div class="flex gap-2">
            <button type="submit" class="rounded bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">
              {{ editingId() ? 'Guardar cambios' : 'Crear asiento' }}
            </button>
            @if (editingId()) {
              <button type="button" (click)="startCreate()" class="rounded bg-slate-200 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-300">
                Cancelar
              </button>
            }
          </div>
        </form>

        <div class="space-y-2">
          @for (seat of seats(); track seat.id) {
            <div class="flex items-center justify-between rounded-lg bg-white p-3 shadow">
              <div>
                <p class="font-medium text-slate-800">{{ seat.seat_number }}</p>
                <p class="text-xs text-slate-500">{{ seat.is_vip ? 'VIP' : 'Estándar' }}</p>
              </div>
              <div class="flex gap-2 text-sm">
                <button type="button" (click)="startEdit(seat)" class="text-indigo-600 hover:underline">Editar</button>
                <button type="button" (click)="remove(seat)" class="text-red-600 hover:underline">Eliminar</button>
              </div>
            </div>
          }
        </div>
      </div>
    }
  </div>
</div>
