databases:
  - name: cinema-db
    plan: free
    databaseName: cinema
    user: cinema

services:
  - type: web
    name: cinema-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m app.seeds.run_all && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cinema-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: "https://cinema-frontend.onrender.com"

  - type: web
    name: cinema-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build:render"
    staticPublishPath: frontend/dist/frontend/browser
    envVars:
      - key: API_URL
        value: "https://cinema-backend.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
